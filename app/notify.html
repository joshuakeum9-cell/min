<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Content Security Policy. Same shape as indicator.html, narrowed to what this
  page actually loads: there is no audio worklet here, so script-src does not
  need blob:, and the popup makes no network calls of any kind, so connect-src
  stays at the 'none' floor.

    script-src  'self' for ./notify.js. Like the other windows, this page has no
                inline script: authorising one needs a sha256 of its text, which
                goes stale on any edit and blanks the window with no error, and
                a window that only exists for the minute before a meeting is the
                worst place to discover something silently failed to render.
    style-src   'unsafe-inline' for the <style> block below. The popup cannot
                import the renderer's stylesheet, so its tokens are copied here.
    font-src    'self' for the vendored IBM Plex Mono woff2 the time range uses.
    img-src     kept as indicator.html has it even though the only graphic here
                is inline SVG markup, which img-src does not govern: an icon
                added later should not mean reopening the policy.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>MIN meeting reminder</title>
<style>
  /*
   * The meeting popup: one card in the top right of the screen, asking whether
   * to take notes. It shows one of two things: a calendar meeting about a minute
   * before it starts, or a meeting Windows says another app has just opened the
   * microphone for. The second kind drops the time line, since there is no
   * calendar event to have one, and grows a chevron beside "Take notes" with a
   * small menu under it, because a detected call is the one that can be wrong
   * about you and needs a way to say "not for this app again".
   *
   * This document IS the window: the window is sized to the card, so the page
   * background is transparent and #card fills it edge to edge. That also rules
   * out a drop shadow, which would be clipped at the window bounds, so the card
   * earns its edge on a wallpaper from a hairline border instead. Consistent
   * with the rest of MIN, which has no shadows. The menu opens in the flow of
   * the card rather than floating over it for the same reason: it would be cut
   * off at the window's edge, so instead the card grows and notify.js tells
   * main the new height to grow the window to.
   *
   * Where the recording nub is deliberately translucent, this card is fully
   * opaque: the nub is a status light, but this one carries a meeting title you
   * have to read in a glance, and wallpaper showing through the letters costs
   * more than the floating look is worth.
   */

  @font-face {
    font-family:'IBM Plex Mono'; font-style:normal; font-display:swap;
    font-weight:400;
    src:url('./fonts/ibm-plex-mono-400-latin.woff2') format('woff2');
  }

  /* Copied from index.html's :root, not re-picked. Only the tokens this page
     uses are here; anything added later should be copied across verbatim too. */
  :root {
    --surface-raised:#ffffff;
    --hairline:#e1e1db;
    --ink:#1c1c1a; --ink-2:#55554f; --ink-3:#8a8a82;
    --accent-ink:#788c15;
    --rail-hover:rgba(28,28,26,.05);
    --mono:'IBM Plex Mono', ui-monospace, Consolas, monospace;
    --fs-md:14px; --fs-sm:13px; --fs-xs:12px;
    --lh-title:1.35; --lh-body:1.5; --lh-ctl:1;
    /* --r-ctl copied verbatim from index.html's :root for the menu items, which
       are .row-menu-item and take its radius. Same value, not re-picked. */
    --r-ctl:6px; --r-card:12px; --r-pill:999px;
  }

  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0;
    /* The window itself is transparent; only #card is visible on the desktop. */
    background:transparent;
    color:var(--ink);
    /*
     * The system sans stack rather than index.html's vendored Archivo, the same
     * choice indicator.html made. A separate BrowserWindow loads its own copy of
     * any face it names, and a 35 KB download in front of a card that has to be
     * legible the instant it appears is a bad trade for one weight of one font.
     * That is why --sans is not among the tokens copied above.
     */
    font:400 var(--fs-md)/var(--lh-body) system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    cursor:default;
  }

  #card {
    display:flex; flex-direction:column; align-items:stretch; gap:5px;
    /* The anchor for #notifyDismiss, which is placed rather than laid out. */
    position:relative;
    /* The window is sized to this card, so the content decides the height. The
       min-height only catches the case where main rounds the window a pixel or
       two taller, which would otherwise show as a transparent strip below. */
    width:320px; min-height:100%;
    padding:13px 16px 15px;
    border:1px solid var(--hairline); border-radius:var(--r-card);
    background:var(--surface-raised);
  }

  /*
   * Same treatment as .now-label in index.html, the tag beside the meeting
   * happening right now in the agenda. The two are saying the same thing about
   * the same event, so they are meant to look like the same thing.
   */
  .eyebrow {
    margin:0;
    font-weight:500; font-size:var(--fs-xs); line-height:var(--lh-ctl);
    color:var(--accent-ink); text-transform:uppercase; letter-spacing:.08em;
  }

  #notifyTitle {
    margin:0;
    font-weight:500; font-size:var(--fs-md); line-height:var(--lh-title);
    /*
     * One line. Wrapping would grow a card in a window main has already sized
     * and placed against the corner of the screen, so a long calendar subject
     * loses its tail rather than its box.
     */
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* Room for the dismiss button, which sits over the top right corner. Only the
     two lines that reach that far need it; the time range never does. */
  .eyebrow, #notifyTitle { padding-right:26px; }

  #notifyTime {
    margin:0;
    font:400 var(--fs-xs)/var(--lh-body) var(--mono); color:var(--ink-2);
    letter-spacing:.02em;
    /* Mono and tabular like every other time in MIN: a time range is measured
       text, not prose. */
    font-variant-numeric:tabular-nums;
  }
  /* A detected call has no calendar event and so no time range. display:none
     rather than an empty line, because an empty flex item still takes its gap
     and would leave a blank strip between the app name and the button. */
  #card[data-kind="detected"] #notifyTime { display:none; }

  /*
   * "Take notes" and, on a detected card, the chevron beside it. One pill
   * group the way Granola draws it: the two buttons touch, and the 1px gap
   * between them shows the card's white through as the divider, so the join
   * needs no colour of its own.
   */
  .actions {
    align-self:flex-start; margin-top:11px;
    display:flex; align-items:center; gap:1px;
  }

  /* Copied from .btn.primary in index.html rather than shared, for the same
     reason as the tokens: this window cannot reach that stylesheet. */
  #notifyTake {
    display:inline-flex; align-items:center; height:32px; padding:0 16px;
    border:1px solid var(--ink); border-radius:var(--r-pill);
    background:var(--ink); color:var(--surface-raised);
    font-family:inherit; font-weight:500; font-size:var(--fs-sm);
    line-height:var(--lh-ctl); white-space:nowrap;
    cursor:pointer;
    transition:background .12s, border-color .12s;
  }
  #notifyTake:hover { background:#000; border-color:#000; }
  /* Squared where it meets the chevron, so the two read as one pill. */
  #card[data-kind="detected"] #notifyTake { border-radius:var(--r-pill) 0 0 var(--r-pill); }

  /* The other half of that pill. Same fill and hover as the button it is
     attached to, so it is not a second control competing with the first, just
     the end of it that opens. Only the detected kind has anything to open. */
  #notifyMore {
    display:none;
    width:30px; height:32px; padding:0;
    place-items:center;
    border:1px solid var(--ink); border-radius:0 var(--r-pill) var(--r-pill) 0;
    background:var(--ink); color:var(--surface-raised);
    cursor:pointer;
    transition:background .12s, border-color .12s;
  }
  #card[data-kind="detected"] #notifyMore { display:grid; }
  #notifyMore:hover { background:#000; border-color:#000; }
  /* Points up while the menu is open: the same glyph, saying "close". */
  #notifyMore[aria-expanded="true"] svg { transform:rotate(180deg); }

  /*
   * Copied from .row-menu and .row-menu-item in index.html, minus two things.
   * The shadow: .row-menu carries the only one in the system, DESIGN.md calls
   * it a lapse, and here it would be clipped at the window's edge anyway. And
   * the absolute position: this menu sits in the card's flow, below the
   * buttons, so opening it makes the card taller and the window grows to match
   * rather than the menu falling off the bottom of a 137px window.
   */
  #notifyMenu {
    display:flex; flex-direction:column; margin-top:8px; padding:4px;
    background:var(--surface-raised); border:1px solid var(--hairline);
    border-radius:var(--r-card);
  }
  #notifyMenu[hidden] { display:none; }
  .menu-item {
    display:block; width:100%; margin:0; padding:6px 10px; text-align:left;
    border:none; border-radius:var(--r-ctl); background:transparent;
    font-family:inherit; font-weight:400; font-size:var(--fs-sm);
    /*
     * --lh-title, not the --lh-ctl the row menu uses. That menu's one item never
     * wraps; the mute item here ends in an app name main labels from whatever
     * Windows recorded, which can be long, and the flat line-height is never
     * used on text that can wrap. The padding is a pixel less to land the
     * single-line item at the same height as a row menu item.
     */
    line-height:var(--lh-title); color:var(--ink);
    overflow-wrap:anywhere;
    cursor:pointer;
  }
  .menu-item:hover, .menu-item:focus-visible { background:var(--rail-hover); outline:none; }

  /* Quiet on purpose. Dismissing is the answer most of these get, but it should
     not compete with the button that is the reason the window opened. */
  #notifyDismiss {
    position:absolute; top:9px; right:9px;
    width:24px; height:24px; padding:0;
    display:grid; place-items:center;
    border:0; border-radius:var(--r-pill);
    background:transparent; color:var(--ink-3); cursor:pointer;
  }
  #notifyDismiss:hover { background:var(--rail-hover); color:var(--ink); }

  svg { display:block; flex:none; }
  :focus-visible { outline:2px solid var(--accent-ink); outline-offset:1px; }
</style>
</head>
<body>
  <!--
    The card ships with a sample meeting in it so the page can be styled by
    opening it in a browser, where no preload runs. notify.js clears these three
    lines the moment it finds a real bridge to push a real meeting. The other
    kind has a sample too, Chrome in the menu below: open the file with
    #detected on the end of the address and notify.js switches the card over to
    it, with no bridge needed.
  -->
  <div id="card">
    <button id="notifyDismiss" type="button" title="Dismiss" aria-label="Dismiss">
      <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
        <path d="M1 1 L9 9 M9 1 L1 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
    <p class="eyebrow"><span id="notifyWhen">In 1 minute</span></p>
    <p id="notifyTitle">Weekly product sync</p>
    <p id="notifyTime">3:00 PM – 4:00 PM</p>
    <div class="actions">
      <button id="notifyTake" type="button">Take notes</button>
      <button id="notifyMore" type="button" aria-label="More options" aria-haspopup="menu" aria-expanded="false" aria-controls="notifyMenu">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
          <path d="M2 3.5 L5 6.5 L8 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <!--
      Three items, in this order, each a real button main can be told about by
      its data-cmd. The app name in the second is the only text in here that
      comes from outside the app; notify.js writes it with textContent.
    -->
    <div id="notifyMenu" role="menu" hidden>
      <button class="menu-item" type="button" role="menuitem" data-cmd="open">Open MIN</button>
      <button class="menu-item" type="button" role="menuitem" data-cmd="mute">Turn off notifications for <span id="notifyMuteApp">Chrome</span></button>
      <button class="menu-item" type="button" role="menuitem" data-cmd="settings">Notification settings</button>
    </div>
  </div>
  <script type="module" src="./notify.js"></script>
</body>
</html>
