<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Content Security Policy. Same shape as index.html, narrowed to what this page
  actually loads: there is no audio worklet here, so script-src does not need
  blob:, and the widget makes no network calls of any kind, so connect-src stays
  at the 'none' floor rather than index.html's 'self'.

    script-src  'self' for ./indicator.js. Like the renderer, this page has no
                inline script: authorising one needs a sha256 of its text, which
                goes stale on any edit and blanks the window with no error, and
                a blank always-on-top window is invisible to debug.
    style-src   'unsafe-inline' for the <style> block below. The widget cannot
                import the renderer's stylesheet, so its tokens are copied here.
    font-src    'self' for the vendored IBM Plex Mono woff2 the clock uses.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>MIN recording</title>
<style>
  /*
   * The floating recording indicator, Granola calls its equivalent the "nub".
   *
   * This document IS the widget: the window is sized to the pill, so the page
   * background is transparent and #pill fills it edge to edge. That also rules
   * out a drop shadow, which would be clipped at the window bounds, so the pill
   * earns its legibility on a wallpaper from a hairline border and a near-opaque
   * white fill instead. Consistent with the rest of MIN, which has no shadows.
   */

  @font-face {
    font-family:'IBM Plex Mono'; font-style:normal; font-display:swap;
    font-weight:400;
    src:url('./fonts/ibm-plex-mono-400-latin.woff2') format('woff2');
  }

  /* Copied from index.html's :root, not re-picked. Only the tokens this page
     uses are here; anything added later should be copied across verbatim too. */
  :root {
    --hairline:#e1e1db;
    --ink:#1c1c1a; --ink-2:#55554f;
    --accent-ink:#788c15;
    --danger:#c2410c; --danger-soft:#f6e2d8;
    --mono:'IBM Plex Mono', ui-monospace, Consolas, monospace;
    --r-pill:999px;

    /* Ink at low alpha rather than a new grey, so the resting bars sit in the
       same family as the rest of the palette. */
    --bar-idle:rgba(28,28,26,.32);
  }

  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0;
    /* The window itself is transparent; only #pill is visible on the desktop. */
    background:transparent;
    color:var(--ink);
    font:400 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    /*
     * No -webkit-app-region:drag. Measured on Windows: it is inert on a
     * focusable:false window, and focusable:false is the property that keeps a
     * click here off the call in front. indicator.js drags by hand instead,
     * using the mousedown and mousemove this page does still receive.
     */
    -webkit-user-select:none; user-select:none;
    cursor:default;
  }

  /* Gaps and paddings are tight on purpose: at 132px wide the pill still has to
     hold an hour-long clock, h:mm:ss, without pushing the stop button out. */
  #pill {
    display:flex; align-items:center; gap:7px;
    height:100%; padding:0 6px 0 9px;
    border:1px solid var(--hairline); border-radius:var(--r-pill);
    /* Not fully opaque: a hint of the wallpaper reads as "floating over" the
       desktop rather than as a stray white rectangle. */
    background:rgba(255,255,255,.9);
  }

  /* The click target that takes you back to the note. */
  .face {
    display:flex; align-items:center; padding:6px 2px;
    border:0; background:transparent; color:inherit; cursor:pointer;
  }
  .face:hover .wave i { background:var(--ink); }
  body.rec .face:hover .wave i { background:var(--accent-ink); }

  .wave { display:flex; align-items:center; gap:3px; height:16px; }
  .wave i {
    display:block; width:3px; height:16px; border-radius:2px;
    background:var(--bar-idle);
    /* Scale rather than height so the bars grow from their middle, matching
       the level bars in the note view. --rest is the height at silence and
       --k the room left above it, and the pair sums to 1 on every bar: at
       rest the four read as a waveform glyph rather than four equal dots,
       and at full level they all reach the top. */
    transform-origin:center;
    transform:scaleY(min(1, calc(var(--rest, .4) + var(--lvl, 0) * var(--k, .6))));
    transition:transform 90ms linear, background-color 160ms linear;
  }
  /* Green and dancing only while audio is actually being captured; grey and
     still otherwise. */
  body.rec .wave i { background:var(--accent-ink); }
  .wave i:nth-child(1) { --rest:.34; --k:.66; }
  .wave i:nth-child(2) { --rest:.62; --k:.38; }
  .wave i:nth-child(3) { --rest:.5;  --k:.5; }
  .wave i:nth-child(4) { --rest:.3;  --k:.7; }

  #clock {
    font:400 12px/1 var(--mono); color:var(--ink-2); letter-spacing:.02em;
    white-space:nowrap;
    /* Tabular figures so the pill does not twitch as the digits change. */
    font-variant-numeric:tabular-nums;
  }
  body:not(.rec) #clock { opacity:.55; }

  #stop {
    margin-left:auto; width:24px; height:24px; flex:none; padding:0;
    display:grid; place-items:center;
    border:0; border-radius:var(--r-pill);
    background:transparent; color:var(--ink-2); cursor:pointer;
  }
  #stop:hover { background:var(--danger-soft); color:var(--danger); }
  /* Nothing to stop when there is no session. Kept in the layout so the pill
     does not change width the moment recording ends. */
  body:not(.rec) #stop { opacity:.35; pointer-events:none; }

  svg { display:block; flex:none; }
  :focus-visible { outline:2px solid var(--accent-ink); outline-offset:1px; }

  @media (prefers-reduced-motion: reduce) {
    .wave i { transition:none; }
  }
</style>
</head>
<body>
  <div id="pill">
    <button id="face" class="face" type="button" title="Back to the note">
      <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </button>
    <span id="clock">00:00</span>
    <button id="stop" type="button" title="Stop recording" aria-label="Stop recording">
      <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect width="10" height="10" rx="2" fill="currentColor"/></svg>
    </button>
  </div>
  <script type="module" src="./indicator.js"></script>
</body>
</html>
