<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Content Security Policy. The renderer is entirely local, so the floor is
  'none' and every source listed is one a specific line needs.

    script-src  'self' loads ./md.js, imported by the module script below.
                blob: loads the audio tap worklet, which is built as a blob
                further down this file. Chromium checks worklet modules against
                script-src, so worker-src does not help here.
                'self' covers renderer.js. The renderer deliberately has no
                inline script: authorising one needs a sha256 of its text, which
                goes stale on any edit and blanks the window with no error.
    style-src   'unsafe-inline' because the design system is the one large
                inline <style> block below. There are no inline event handlers,
                so script-src stays free of it.
    font-src    'self' for the vendored woff2 files in ./fonts.
    connect-src 'self'. The renderer makes no network calls; everything
                that touches disk goes through IPC to the main process.
    img-src, media-src: nothing loads either today. Both are pinned to local
                sources so that adding an icon or a playback element later does
                not mean reopening the policy to a remote origin.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>MIN</title>
<style>
  /*
   * MIN's design system, light mode, at application scale.
   *
   * One canvas, one type system, one accent. White canvas, ink type,
   * canvas-paper panels, and hairlines in place of borders and shadows, so the
   * window stays quiet enough to sit on top of a call for an hour.
   *
   * Coral is the only chromatic colour in the interface, and it does two jobs.
   * It fills the Record button, the highest-priority action in the product.
   * Everywhere else it is a mark, never a fill: the brand dot beside the
   * wordmark, the "on top" checkbox, the clock while a recording runs, the
   * selected meeting row, the open detail tab, and selected text. The rest of
   * the interface is greyscale, so anything coral is either the main action or
   * a pointer at what is live or selected right now.
   *
   * Two typefaces ship with the app, both under the SIL Open Font License and
   * both self-hosted in app/fonts so a launch never reaches a font CDN. IBM
   * Plex Mono is reserved for technical eyebrows, meter labels and small-caps
   * captions. Archivo carries every other role: wordmark, titles, body,
   * buttons. A pill for the primary action, 3-6px radii for in-product
   * controls.
   */
  /*
   * Vendored so a launch never contacts Google. Latin subset only; anything
   * outside it falls through to the stacks in --sans / --mono below.
   * Provenance and licence: fonts/README.md, fonts/OFL.txt.
   */
  @font-face {
    font-family:'Archivo'; font-style:normal; font-display:swap;
    /* One variable file carries 400, 500 and 600. */
    font-weight:100 900; font-stretch:100%;
    src:url('./fonts/archivo-latin-wght.woff2') format('woff2');
  }
  @font-face {
    font-family:'IBM Plex Mono'; font-style:normal; font-display:swap;
    font-weight:400;
    src:url('./fonts/ibm-plex-mono-400-latin.woff2') format('woff2');
  }
  @font-face {
    font-family:'IBM Plex Mono'; font-style:normal; font-display:swap;
    font-weight:500;
    src:url('./fonts/ibm-plex-mono-500-latin.woff2') format('woff2');
  }
  :root {
    --canvas:#ffffff; --canvas-paper:#ededed; --canvas-sunk:#f7f7f7;
    --hairline:#ededed; --hairline-strong:#dcdcdc;
    --ink:#0b0b0b; --ink-soft:#212121; --graphite:#353535;
    --mute:#797979; --ash:#b9b9b9; --slate:#3c4758; --slate-soft:#505b6c;
    --brand:#f36458; --brand-deep:#dd0000;
    --success:#37cd84; --error:#dd0000; --link:#0052ef;

    --sans:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, Consolas, monospace;

    --r-xs:3px; --r-sm:4px; --r-md:5px; --r-lg:6px; --r-full:9999px;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--canvas); color:var(--ink-soft);
    font:400 15px/1.5 var(--sans); -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .hide { display:none !important; }
  ::selection { background:var(--brand); color:var(--canvas); }

  /* ---------------------------------------------------------------- header */
  header.top {
    display:flex; align-items:center; gap:16px; padding:0 16px; height:56px;
    flex:none; background:var(--canvas); border-bottom:1px solid var(--hairline);
  }
  .wordmark {
    display:flex; align-items:center; gap:8px;
    font:700 19px/1 var(--sans); letter-spacing:0.04em; color:var(--ink);
  }
  /* The brand dot beside the wordmark. Identity, not state. */
  .wordmark::after {
    content:''; width:8px; height:8px; border-radius:var(--r-full);
    background:var(--brand); flex:none;
  }
  .tabs { display:flex; gap:4px; }
  .tabs button {
    background:var(--canvas-paper); border:1px solid transparent; cursor:pointer;
    height:32px; padding:0 12px; border-radius:var(--r-sm);
    font:600 11px/1 var(--sans); letter-spacing:.06em; text-transform:uppercase;
    color:var(--mute);
  }
  .tabs button:hover { color:var(--ink); border-color:var(--hairline-strong); }
  .tabs button.on { background:var(--ink); color:var(--canvas); }
  .tabs button:focus-visible { outline:2px solid var(--link); outline-offset:1px; }
  .spacer { flex:1; }
  .pin {
    display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none;
    font:400 10px/1.5 var(--mono); letter-spacing:.06em; text-transform:uppercase;
    color:var(--mute);
  }
  .pin input { accent-color:var(--brand); margin:0; }

  .view { flex:1; min-height:0; display:flex; flex-direction:column; }

  /* --------------------------------------------------------------- buttons */
  .btn {
    font:500 13px/1 var(--sans); letter-spacing:-0.01em; cursor:pointer;
    height:36px; padding:0 14px; border-radius:var(--r-md);
    border:1px solid var(--hairline-strong); background:var(--canvas); color:var(--ink-soft);
    display:inline-flex; align-items:center; gap:8px; white-space:nowrap;
    transition:background .12s, color .12s, border-color .12s;
  }
  .btn:hover { background:var(--canvas-paper); color:var(--ink); border-color:var(--mute); }
  .btn:focus-visible { outline:2px solid var(--link); outline-offset:2px; }
  .btn:disabled { opacity:.36; cursor:not-allowed; }
  .btn:disabled:hover { background:var(--canvas); color:var(--ink-soft); border-color:var(--hairline-strong); }

  /* button-primary-on-light: ink fill, white text, pill */
  .btn.primary {
    background:var(--ink); color:var(--canvas); border-color:var(--ink);
    border-radius:var(--r-full); height:38px; padding:0 18px;
  }
  .btn.primary:hover { background:#000; border-color:#000; color:var(--canvas); }

  /* The one coral action in the product. */
  .btn.brand {
    background:var(--brand); color:var(--ink); border-color:var(--brand);
    border-radius:var(--r-full); height:38px; padding:0 18px; font-weight:600;
  }
  .btn.brand:hover { background:#f5766b; border-color:#f5766b; color:var(--ink); }
  .btn.sm { height:30px; padding:0 11px; font-size:12px; }

  .dot { width:8px; height:8px; border-radius:var(--r-full); background:currentColor; flex:none; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.3 } }
  .btn.rec-on .dot { animation:pulse 1.3s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .btn.rec-on .dot { animation:none } }

  /* ------------------------------------------------------------- transport */
  .transport { display:flex; align-items:center; gap:12px; padding:16px 16px 12px; flex:none; }
  #title {
    flex:1; min-width:0; background:transparent; border:none; color:var(--ink);
    font:500 24px/1.1 var(--sans); letter-spacing:-0.024em; padding:0; outline:none;
  }
  #title::placeholder { color:var(--ash); }
  #clock {
    font:400 13px/1 var(--mono); color:var(--mute); font-variant-numeric:tabular-nums;
  }
  #clock.live { color:var(--brand); }

  /* Meters are diagnostics. Mono labels, hairline tracks, nothing shouting. */
  .meters { display:flex; gap:20px; padding:0 16px 14px; flex:none; }
  .meter { display:flex; align-items:center; gap:9px; flex:1; }
  .meter .tag {
    font:400 10px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase;
    color:var(--mute); width:34px; flex:none;
  }
  .bar { flex:1; height:2px; background:var(--hairline); overflow:hidden; }
  .bar i { display:block; height:100%; width:0; transition:width .09s linear; }
  .m-you .bar i { background:var(--ink); }
  .m-them .bar i { background:var(--slate-soft); }
  .meter .secs {
    font:400 10px/1 var(--mono); color:var(--mute); width:28px; text-align:right;
    flex:none; font-variant-numeric:tabular-nums;
  }

  /* ----------------------------------------------------------------- notes */
  .sheet { flex:1; min-height:0; padding:0 16px; display:flex; }
  #notes {
    flex:1; width:100%; resize:none; outline:none;
    background:var(--canvas); color:var(--ink-soft);
    border:1px solid var(--hairline-strong); border-radius:var(--r-xs);
    padding:16px; font:400 15px/1.68 var(--sans);
  }
  #notes:focus { border-color:var(--mute); }
  #notes::placeholder { color:var(--ash); }

  .actions { display:flex; gap:8px; align-items:center; padding:14px 16px; flex:none; }
  .actions #write { flex:1; justify-content:center; }
  select.prov {
    background:var(--canvas); color:var(--ink-soft); border:1px solid var(--hairline-strong);
    border-radius:var(--r-md); height:36px; padding:0 9px;
    font:500 12.5px/1 var(--sans); outline:none; cursor:pointer;
  }
  select.prov:hover { color:var(--ink); border-color:var(--mute); }
  select.prov:focus { border-color:var(--link); }

  /* -------------------------------------------------------------- meetings */
  .searchbar { padding:16px 16px 12px; flex:none; display:flex; gap:8px; }
  #q {
    flex:1; background:var(--canvas); color:var(--ink-soft);
    border:1px solid var(--hairline-strong); border-radius:var(--r-xs);
    height:38px; padding:0 12px; font:400 14px var(--sans); outline:none;
  }
  #q:focus { border-color:var(--mute); }
  #q::placeholder { color:var(--ash); }

  .split { flex:1; min-height:0; display:flex; border-top:1px solid var(--hairline); }
  .list {
    width:208px; flex:none; overflow-y:auto; background:var(--canvas-sunk);
    border-right:1px solid var(--hairline);
  }
  .row {
    padding:12px 14px; cursor:pointer; display:grid; gap:5px;
    border-bottom:1px solid var(--hairline); border-left:2px solid transparent;
  }
  .row:hover { background:var(--canvas-paper); }
  .row.on { background:var(--canvas); border-left-color:var(--brand); }
  .row .t {
    font:500 14px/1.3 var(--sans); letter-spacing:-0.014em; color:var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .row .m {
    font:400 10px/1.4 var(--mono); color:var(--mute); display:flex;
    align-items:center; gap:7px; letter-spacing:.02em;
  }
  .pip { width:6px; height:6px; border-radius:var(--r-full); flex:none; }
  .p-wr { background:var(--success); }
  .p-tx { background:var(--slate-soft); }
  .p-no { background:transparent; border:1px solid var(--ash); }
  .snip { font:400 11.5px/1.5 var(--sans); color:var(--mute); }
  .snip b { color:var(--ink); font-weight:500; }

  .detail { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--canvas); }
  .dhead { padding:20px 22px 12px; flex:none; }
  .dhead h2 {
    margin:0 0 6px; font:500 26px/1.1 var(--sans); letter-spacing:-0.026em; color:var(--ink);
  }
  .dhead .sub {
    font:400 10.5px/1.5 var(--mono); color:var(--mute);
    letter-spacing:.05em; text-transform:uppercase;
  }
  .dacts { display:flex; gap:8px; flex-wrap:wrap; padding:0 22px 16px; flex:none; }
  .dtabs { display:flex; gap:0; padding:0 22px; border-bottom:1px solid var(--hairline); flex:none; }
  .dtabs button {
    background:none; border:none; border-bottom:2px solid transparent; cursor:pointer;
    color:var(--mute); font:600 11px/1 var(--sans); letter-spacing:.07em;
    text-transform:uppercase; padding:10px 2px; margin-right:20px;
  }
  .dtabs button:hover { color:var(--ink-soft); }
  .dtabs button.on { color:var(--ink); border-bottom-color:var(--brand); }
  .dbody { flex:1; min-height:0; overflow-y:auto; padding:22px; }

  .dbody .doc { max-width:68ch; font:400 15px/1.62 var(--sans); color:var(--ink-soft); }
  .dbody .doc h2, .dbody .doc h3, .dbody .doc h4, .dbody .doc h5 {
    font-family:var(--sans); font-weight:500; color:var(--ink);
    letter-spacing:-0.02em; margin:28px 0 9px; line-height:1.13;
  }
  .dbody .doc > :first-child { margin-top:0; }
  .dbody .doc h2 { font-size:21px; }
  .dbody .doc h3 { font-size:17px; }
  .dbody .doc h4, .dbody .doc h5 { font-size:15px; }
  .dbody .doc p { margin:0 0 14px; }
  .dbody .doc ul, .dbody .doc ol { margin:0 0 14px; padding-left:20px; }
  .dbody .doc li { margin-bottom:6px; }
  .dbody .doc li::marker { color:var(--ash); }
  .dbody .doc strong { color:var(--ink); font-weight:500; }
  .dbody .doc a { color:var(--link); }
  .dbody .doc code {
    font:0.87em var(--mono); background:var(--canvas-paper);
    padding:.12em .38em; border-radius:var(--r-xs); color:var(--ink-soft);
  }
  .dbody .doc blockquote {
    margin:0 0 14px; padding-left:14px; border-left:2px solid var(--hairline-strong); color:var(--mute);
  }
  .dbody .doc hr { border:none; border-top:1px solid var(--hairline); margin:24px 0; }

  /* Transcript: a technical document. Mono eyebrows do the structural work. */
  .dbody .doc.script { max-width:76ch; }
  .dbody .doc.script .line {
    margin:0 0 10px; display:grid; grid-template-columns:64px 46px 1fr; gap:12px;
    font-size:14px; line-height:1.6;
  }
  .dbody .doc.script .ts {
    font:400 10.5px/2 var(--mono); color:var(--ash); font-variant-numeric:tabular-nums;
  }
  .dbody .doc.script .who {
    font:400 10px/2.1 var(--mono); letter-spacing:.08em; text-transform:uppercase;
  }
  .dbody .doc.script .who.you  { color:var(--ink); }
  .dbody .doc.script .who.them { color:var(--slate-soft); }

  .dbody .empty { color:var(--mute); font-size:14px; line-height:1.65; max-width:54ch; }
  .dbody .empty b { color:var(--ink); font-weight:500; }
  .dbody textarea {
    width:100%; min-height:240px; margin-top:14px; resize:vertical;
    background:var(--canvas); color:var(--ink-soft);
    border:1px solid var(--hairline-strong); border-radius:var(--r-xs);
    padding:14px; font:400 14px/1.6 var(--sans); outline:none;
  }
  .dbody textarea:focus { border-color:var(--mute); }

  /* ---------------------------------------------------------------- footer */
  footer {
    padding:0 16px; flex:none; height:40px; display:flex; align-items:center;
    border-top:1px solid var(--hairline); background:var(--canvas);
  }
  #status {
    font:400 10.5px/1.5 var(--mono); color:var(--mute); flex:1;
    letter-spacing:.03em;
  }
  #status.warn { color:var(--error); }
  #status.good { color:#2a9d5c; }
</style>
</head>
<body>

<header class="top">
  <span class="wordmark">MIN</span>
  <nav class="tabs">
    <button id="tabRec" class="on">Notes</button>
    <button id="tabLib">Meetings</button>
  </nav>
  <span class="spacer"></span>
  <label class="pin" title="Keep this window above your call">
    <input type="checkbox" id="ontop" checked> on top
  </label>
</header>

<!-- ────────────────────────────── notes ────────────────────────────── -->
<section class="view" id="viewRec">
  <div class="transport">
    <input id="title" placeholder="Untitled meeting" autocomplete="off">
    <span id="clock">00:00</span>
    <button id="rec" class="btn brand"><span class="dot"></span>Record</button>
    <button id="stopBtn" class="btn" disabled>Stop</button>
  </div>

  <div class="meters">
    <div class="meter m-you">
      <span class="tag">You</span>
      <span class="bar"><i id="micLvl"></i></span>
      <span class="secs" id="micVal"></span>
    </div>
    <div class="meter m-them">
      <span class="tag">Them</span>
      <span class="bar"><i id="sysLvl"></i></span>
      <span class="secs" id="sysVal"></span>
    </div>
  </div>

  <div class="sheet">
    <textarea id="notes" spellcheck="true"
      placeholder="Type as the meeting goes. Fragments are fine: half sentences, a heading, a name with a question mark.&#10;&#10;Use # for headings. They become the sections of your write-up.&#10;&#10;These notes are the skeleton. Nothing rewrites them."></textarea>
  </div>

  <div class="actions hide" id="after">
    <button id="write" class="btn primary">Write up with</button>
    <select id="provider" class="prov" title="Which assistant to open"></select>
    <button id="openRec" class="btn sm">Folder</button>
  </div>
</section>

<!-- ───────────────────────────── meetings ──────────────────────────── -->
<section class="view hide" id="viewLib">
  <div class="searchbar">
    <input id="q" placeholder="Search everything you have said and heard" autocomplete="off">
    <button id="clearQ" class="btn sm">Clear</button>
  </div>
  <div class="split">
    <div class="list" id="list"></div>
    <div class="detail" id="detail">
      <div class="dbody"><p class="empty">Select a meeting.</p></div>
    </div>
  </div>
</section>

<footer><span id="status">Ready.</span></footer>

<script type="module" src="./renderer.js"></script>
</body>
</html>
