<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Taonim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /*
   * Taonim design system, applied at application scale.
   *
   * The source system is a dark-first editorial surface: near-black canvas,
   * white headlines, ash body, and ONE coral accent used so sparingly that a
   * viewer can predict where it appears. Here that single accent is spent on the
   * Record button — the highest-priority action in the product — and the brand
   * dot beside the wordmark. Nothing else is coral.
   *
   * IBM Plex Mono is reserved strictly for technical eyebrows and small-caps
   * labels (speaker tags, timestamps, meter labels). Every other role is the
   * grotesque. Marketing pills coexist with sharply-cut 3-6px application radii,
   * which is the system's stated dual identity — so the primary action is a pill
   * and every in-product control is cut square.
   */
  :root {
    --canvas:#0b0b0b; --canvas-soft:#212121; --graphite:#353535;
    --hairline-soft:#353535; --slate:#3c4758; --slate-soft:#505b6c;
    --white:#ffffff; --ash:#b9b9b9; --mute:#797979;
    --brand:#f36458; --brand-deep:#dd0000;
    --success:#37cd84; --error:#dd0000; --link:#55beff;

    --sans:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, Consolas, monospace;

    --r-xs:3px; --r-sm:4px; --r-md:5px; --r-lg:6px; --r-full:9999px;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--canvas); color:var(--ash);
    font:400 15px/1.5 var(--sans); -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .hide { display:none !important; }
  ::selection { background:var(--brand); color:var(--canvas); }

  /* ---------------------------------------------------------------- header */
  header.top {
    display:flex; align-items:center; gap:16px; padding:0 16px; height:56px;
    flex:none; background:var(--canvas); border-bottom:1px solid var(--hairline-soft);
  }
  .wordmark {
    display:flex; align-items:center; gap:8px;
    font:500 19px/1 var(--sans); letter-spacing:-0.019em; color:var(--white);
  }
  /* The brand dot — one of exactly two places coral is permitted. */
  .wordmark::after {
    content:''; width:8px; height:8px; border-radius:var(--r-full);
    background:var(--brand); flex:none;
  }
  .tabs { display:flex; gap:4px; }
  .tabs button {
    background:var(--canvas-soft); border:1px solid transparent; cursor:pointer;
    height:32px; padding:0 12px; border-radius:var(--r-sm);
    font:600 11px/1 var(--sans); letter-spacing:.06em; text-transform:uppercase;
    color:var(--mute);
  }
  .tabs button:hover { color:var(--ash); border-color:var(--graphite); }
  .tabs button.on { background:var(--white); color:var(--canvas); }
  .tabs button:focus-visible { outline:2px solid var(--link); outline-offset:1px; }
  .spacer { flex:1; }
  .pin {
    display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none;
    font:400 10px/1.5 var(--mono); letter-spacing:.06em; text-transform:uppercase;
    color:var(--mute);
  }
  .pin input { accent-color:var(--brand); margin:0; }

  .view { flex:1; min-height:0; display:flex; flex-direction:column; }

  /* --------------------------------------------------------------- buttons */
  /* Pill = marketing-grade primary action. Square = in-product control. */
  .btn {
    font:500 13px/1 var(--sans); letter-spacing:-0.01em; cursor:pointer;
    height:36px; padding:0 14px; border-radius:var(--r-md);
    border:1px solid var(--graphite); background:var(--canvas-soft); color:var(--ash);
    display:inline-flex; align-items:center; gap:8px; white-space:nowrap;
    transition:background .12s, color .12s, border-color .12s;
  }
  .btn:hover { color:var(--white); border-color:var(--slate-soft); }
  .btn:focus-visible { outline:2px solid var(--link); outline-offset:2px; }
  .btn:disabled { opacity:.34; cursor:not-allowed; }
  .btn:disabled:hover { color:var(--ash); border-color:var(--graphite); }

  .btn.primary {
    background:var(--white); color:var(--canvas); border-color:var(--white);
    border-radius:var(--r-full); height:38px; padding:0 18px; font-weight:500;
  }
  .btn.primary:hover { background:#e8e8e8; border-color:#e8e8e8; color:var(--canvas); }

  /* The one coral action in the product. */
  .btn.brand {
    background:var(--brand); color:var(--canvas); border-color:var(--brand);
    border-radius:var(--r-full); height:38px; padding:0 18px; font-weight:600;
  }
  .btn.brand:hover { background:#f5766b; border-color:#f5766b; color:var(--canvas); }
  .btn.sm { height:30px; padding:0 11px; font-size:12px; }

  .dot { width:8px; height:8px; border-radius:var(--r-full); background:currentColor; flex:none; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.3 } }
  .btn.rec-on .dot { animation:pulse 1.3s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .btn.rec-on .dot { animation:none } }

  /* ------------------------------------------------------------- transport */
  .transport { display:flex; align-items:center; gap:12px; padding:16px 16px 12px; flex:none; }
  #title {
    flex:1; min-width:0; background:transparent; border:none; color:var(--white);
    font:500 24px/1.1 var(--sans); letter-spacing:-0.024em; padding:0; outline:none;
  }
  #title::placeholder { color:var(--graphite); }
  #clock {
    font:400 13px/1 var(--mono); color:var(--mute); font-variant-numeric:tabular-nums;
  }
  #clock.live { color:var(--brand); }

  /* Meters are diagnostics. Mono labels, hairline tracks, nothing shouting. */
  .meters { display:flex; gap:20px; padding:0 16px 14px; flex:none; }
  .meter { display:flex; align-items:center; gap:9px; flex:1; }
  .meter .tag {
    font:400 10px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase;
    color:var(--mute); width:34px; flex:none;
  }
  .bar { flex:1; height:2px; background:var(--graphite); overflow:hidden; }
  .bar i { display:block; height:100%; width:0; transition:width .09s linear; }
  .m-you .bar i { background:var(--white); }
  .m-them .bar i { background:var(--slate-soft); }
  .meter .secs {
    font:400 10px/1 var(--mono); color:var(--mute); width:28px; text-align:right;
    flex:none; font-variant-numeric:tabular-nums;
  }

  /* ----------------------------------------------------------------- notes */
  .sheet { flex:1; min-height:0; padding:0 16px; display:flex; }
  #notes {
    flex:1; width:100%; resize:none; outline:none;
    background:var(--canvas); color:var(--ash);
    border:1px solid var(--hairline-soft); border-radius:var(--r-xs);
    padding:16px; font:400 15px/1.68 var(--sans);
  }
  #notes:focus { border-color:var(--slate-soft); }
  #notes::placeholder { color:var(--graphite); }

  .actions { display:flex; gap:8px; align-items:center; padding:14px 16px; flex:none; }
  .actions #write { flex:1; justify-content:center; }
  select.prov {
    background:var(--canvas-soft); color:var(--ash); border:1px solid var(--graphite);
    border-radius:var(--r-md); height:36px; padding:0 9px;
    font:500 12.5px/1 var(--sans); outline:none; cursor:pointer;
  }
  select.prov:hover { color:var(--white); border-color:var(--slate-soft); }
  select.prov:focus { border-color:var(--link); }

  /* -------------------------------------------------------------- meetings */
  .searchbar { padding:16px 16px 12px; flex:none; display:flex; gap:8px; }
  #q {
    flex:1; background:var(--canvas); color:var(--ash);
    border:1px solid var(--hairline-soft); border-radius:var(--r-xs);
    height:38px; padding:0 12px; font:400 14px var(--sans); outline:none;
  }
  #q:focus { border-color:var(--slate-soft); }
  #q::placeholder { color:var(--graphite); }

  .split { flex:1; min-height:0; display:flex; border-top:1px solid var(--hairline-soft); }
  .list {
    width:208px; flex:none; overflow-y:auto; background:var(--canvas);
    border-right:1px solid var(--hairline-soft);
  }
  .row {
    padding:12px 14px; cursor:pointer; display:grid; gap:5px;
    border-bottom:1px solid var(--hairline-soft); border-left:2px solid transparent;
  }
  .row:hover { background:var(--canvas-soft); }
  .row.on { background:var(--canvas-soft); border-left-color:var(--brand); }
  .row .t {
    font:500 14px/1.3 var(--sans); letter-spacing:-0.014em; color:var(--white);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .row .m {
    font:400 10px/1.4 var(--mono); color:var(--mute); display:flex;
    align-items:center; gap:7px; letter-spacing:.02em;
  }
  .pip { width:6px; height:6px; border-radius:var(--r-full); flex:none; }
  .p-wr { background:var(--success); }
  .p-tx { background:var(--slate-soft); }
  .p-no { background:transparent; border:1px solid var(--graphite); }
  .snip { font:400 11.5px/1.5 var(--sans); color:var(--mute); }
  .snip b { color:var(--white); font-weight:500; }

  .detail { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--canvas); }
  .dhead { padding:20px 22px 12px; flex:none; }
  .dhead h2 {
    margin:0 0 6px; font:500 26px/1.1 var(--sans); letter-spacing:-0.026em; color:var(--white);
  }
  .dhead .sub {
    font:400 10.5px/1.5 var(--mono); color:var(--mute);
    letter-spacing:.05em; text-transform:uppercase;
  }
  .dacts { display:flex; gap:8px; flex-wrap:wrap; padding:0 22px 16px; flex:none; }
  .dtabs { display:flex; gap:0; padding:0 22px; border-bottom:1px solid var(--hairline-soft); flex:none; }
  .dtabs button {
    background:none; border:none; border-bottom:2px solid transparent; cursor:pointer;
    color:var(--mute); font:600 11px/1 var(--sans); letter-spacing:.07em;
    text-transform:uppercase; padding:10px 2px; margin-right:20px;
  }
  .dtabs button:hover { color:var(--ash); }
  .dtabs button.on { color:var(--white); border-bottom-color:var(--brand); }
  .dbody { flex:1; min-height:0; overflow-y:auto; padding:22px; }

  .dbody .doc { max-width:68ch; font:400 15px/1.62 var(--sans); color:var(--ash); }
  .dbody .doc h2, .dbody .doc h3, .dbody .doc h4, .dbody .doc h5 {
    font-family:var(--sans); font-weight:500; color:var(--white);
    letter-spacing:-0.02em; margin:28px 0 9px; line-height:1.13;
  }
  .dbody .doc > :first-child { margin-top:0; }
  .dbody .doc h2 { font-size:21px; }
  .dbody .doc h3 { font-size:17px; }
  .dbody .doc h4, .dbody .doc h5 { font-size:15px; }
  .dbody .doc p { margin:0 0 14px; }
  .dbody .doc ul, .dbody .doc ol { margin:0 0 14px; padding-left:20px; }
  .dbody .doc li { margin-bottom:6px; }
  .dbody .doc li::marker { color:var(--graphite); }
  .dbody .doc strong { color:var(--white); font-weight:500; }
  .dbody .doc a { color:var(--link); }
  .dbody .doc code {
    font:0.87em var(--mono); background:var(--canvas-soft);
    padding:.12em .38em; border-radius:var(--r-xs); color:var(--ash);
  }
  .dbody .doc blockquote {
    margin:0 0 14px; padding-left:14px; border-left:2px solid var(--graphite); color:var(--mute);
  }
  .dbody .doc hr { border:none; border-top:1px solid var(--hairline-soft); margin:24px 0; }

  /* Transcript: a technical document. Mono eyebrows do the structural work. */
  .dbody .doc.script { max-width:76ch; }
  .dbody .doc.script .line {
    margin:0 0 10px; display:grid; grid-template-columns:64px 46px 1fr; gap:12px;
    font-size:14px; line-height:1.6;
  }
  .dbody .doc.script .ts {
    font:400 10.5px/2 var(--mono); color:var(--graphite); font-variant-numeric:tabular-nums;
  }
  .dbody .doc.script .who {
    font:400 10px/2.1 var(--mono); letter-spacing:.08em; text-transform:uppercase;
  }
  .dbody .doc.script .who.you  { color:var(--white); }
  .dbody .doc.script .who.them { color:var(--slate-soft); }

  .dbody .empty { color:var(--mute); font-size:14px; line-height:1.65; max-width:54ch; }
  .dbody .empty b { color:var(--white); font-weight:500; }
  .dbody textarea {
    width:100%; min-height:240px; margin-top:14px; resize:vertical;
    background:var(--canvas); color:var(--ash);
    border:1px solid var(--hairline-soft); border-radius:var(--r-xs);
    padding:14px; font:400 14px/1.6 var(--sans); outline:none;
  }
  .dbody textarea:focus { border-color:var(--slate-soft); }

  /* ---------------------------------------------------------------- footer */
  footer {
    padding:0 16px; flex:none; height:40px; display:flex; align-items:center;
    border-top:1px solid var(--hairline-soft); background:var(--canvas);
  }
  #status {
    font:400 10.5px/1.5 var(--mono); color:var(--mute); flex:1;
    letter-spacing:.03em;
  }
  #status.warn { color:var(--error); }
  #status.good { color:var(--success); }
</style>
</head>
<body>

<header class="top">
  <span class="wordmark">Taonim</span>
  <nav class="tabs">
    <button id="tabRec" class="on">Notes</button>
    <button id="tabLib">Meetings</button>
  </nav>
  <span class="spacer"></span>
  <label class="pin" title="Keep this window above your call">
    <input type="checkbox" id="ontop" checked> on top
  </label>
</header>

<!-- ────────────────────────────── notes ────────────────────────────── -->
<section class="view" id="viewRec">
  <div class="transport">
    <input id="title" placeholder="Untitled meeting" autocomplete="off">
    <span id="clock">00:00</span>
    <button id="rec" class="btn brand"><span class="dot"></span>Record</button>
    <button id="stopBtn" class="btn" disabled>Stop</button>
  </div>

  <div class="meters">
    <div class="meter m-you">
      <span class="tag">You</span>
      <span class="bar"><i id="micLvl"></i></span>
      <span class="secs" id="micVal"></span>
    </div>
    <div class="meter m-them">
      <span class="tag">Them</span>
      <span class="bar"><i id="sysLvl"></i></span>
      <span class="secs" id="sysVal"></span>
    </div>
  </div>

  <div class="sheet">
    <textarea id="notes" spellcheck="true"
      placeholder="Type as the meeting goes. Fragments are fine — half sentences, a heading, a name with a question mark.&#10;&#10;Use # for headings. They become the sections of your write-up.&#10;&#10;These notes are the skeleton. Nothing rewrites them."></textarea>
  </div>

  <div class="actions hide" id="after">
    <button id="write" class="btn primary">Write up with</button>
    <select id="provider" class="prov" title="Which assistant to open"></select>
    <button id="openRec" class="btn sm">Folder</button>
  </div>
</section>

<!-- ───────────────────────────── meetings ──────────────────────────── -->
<section class="view hide" id="viewLib">
  <div class="searchbar">
    <input id="q" placeholder="Search everything you have said and heard" autocomplete="off">
    <button id="clearQ" class="btn sm">Clear</button>
  </div>
  <div class="split">
    <div class="list" id="list"></div>
    <div class="detail" id="detail">
      <div class="dbody"><p class="empty">Select a meeting.</p></div>
    </div>
  </div>
</section>

<footer><span id="status">Ready.</span></footer>

<script type="module">
import { renderMarkdown, renderTranscript } from './md.js';

const $ = (id) => document.getElementById(id);
const statusEl = $('status');
const setStatus = (m, cls = '') => { statusEl.className = cls; statusEl.textContent = m; };
const esc = (s) => (s ?? '').replace(/[&<>]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));

/* ═══════════════════════════════ recording ═══════════════════════════════ */

const SAMPLE_RATE = 16000;   // what the recogniser wants; the browser resamples
const MAX_MINUTES = 180;

const WORKLET = `
class Tap extends AudioWorkletProcessor {
  constructor() { super(); this.blocks = 0; this.empty = 0; this.frames = 0; }
  process(inputs) {
    this.blocks++;
    const ch = inputs[0] && inputs[0][0];
    if (!ch || ch.length === 0) { this.empty++; return true; }
    this.frames += ch.length;
    let peak = 0;
    for (let i = 0; i < ch.length; i++) { const a = ch[i] < 0 ? -ch[i] : ch[i]; if (a > peak) peak = a; }
    this.port.postMessage({ pcm: ch.slice(0), peak, frames: this.frames, blocks: this.blocks, empty: this.empty });
    return true;
  }
}
registerProcessor('tap', Tap);
`;

const T = {
  mic: { chunks: [], frames: 0, empty: 0, blocks: 0, peak: 0, lvl: $('micLvl'), val: $('micVal') },
  sys: { chunks: [], frames: 0, empty: 0, blocks: 0, peak: 0, lvl: $('sysLvl'), val: $('sysVal') },
};

let ctx = null, streams = {}, nodes = [], recording = false;
let startedAt = 0, tick = null, deviceEvents = [], capTimer = null, lastDir = null;
let starting = false;   // start() awaits three times before disabling the button

/** Release every device and node. Safe to call twice. */
function teardownCapture() {
  clearInterval(tick); clearTimeout(capTimer);
  for (const n of nodes) { try { n.disconnect(); } catch {} }
  nodes = [];
  for (const st of Object.values(streams)) st?.getTracks().forEach((t) => t.stop());
  streams = {};
}

function resetTracks() {
  for (const k of ['mic', 'sys']) {
    Object.assign(T[k], { chunks: [], frames: 0, empty: 0, blocks: 0, peak: 0 });
    T[k].lvl.style.width = '0';
    T[k].val.textContent = '';
  }
  deviceEvents = [];
}

async function attach(key, stream) {
  const src = ctx.createMediaStreamSource(stream);
  // A bare node inherits channelCount:2/'max', so a stereo loopback source
  // presents two channels and the worklet's inputs[0][0] silently drops the
  // right one. Forcing explicit mono makes the graph do the spec's 0.5*(L+R).
  const node = new AudioWorkletNode(ctx, 'tap', {
    channelCount: 1,
    channelCountMode: 'explicit',
    channelInterpretation: 'speakers',
  });
  node.port.onmessage = ({ data }) => {
    const t = T[key];
    t.chunks.push(data.pcm);
    t.frames = data.frames; t.blocks = data.blocks; t.empty = data.empty;
    if (data.peak > t.peak) t.peak = data.peak;
    t.lvl.style.width = Math.min(100, Math.sqrt(data.peak) * 130) + '%';
  };
  const mute = ctx.createGain();
  mute.gain.value = 0;               // pull the graph without reaching the speakers
  src.connect(node).connect(mute).connect(ctx.destination);
  nodes.push(src, node, mute);
}

/**
 * Two failures look alike but mean opposite things. A silent-but-flowing track is
 * a dead device. A track with no frames at all is ambiguous on Windows, because
 * WASAPI loopback sends nothing during silence rather than sending zeros — so an
 * idle machine and a broken capture are indistinguishable from here. Say which is
 * which instead of guessing, and keep watching rather than crying wolf.
 */
function checkSignal() {
  const problems = [];
  for (const [key, label] of [['mic', 'your microphone'], ['sys', 'system audio']]) {
    const t = T[key];
    if (t.peak >= 1e-4) continue;
    problems.push(
      t.frames === 0
        ? `${label} has delivered no data yet` +
            (key === 'sys' ? ' — normal if nothing is playing' : '')
        : `${label} is delivering audio but it is silent — wrong device, or muted`
    );
  }
  if (!problems.length) return setStatus('● Recording. Both channels have signal.');
  setStatus('⚠ ' + problems.join('. ') + '.', 'warn');
  if (recording) capTimer = setTimeout(checkSignal, 2000);
}

function onDeviceChange() {
  deviceEvents.push({ at: Date.now() - startedAt, event: 'devicechange' });
  setStatus('⚠ Audio devices changed mid-recording — a gap may exist from here.', 'warn');
}

async function start() {
  // Three awaits happen before the button is disabled. Without this guard a
  // second click attaches a second pair of worklet nodes to the same buffers;
  // the frame counters then disagree with the data and concat() throws on Stop,
  // outside the try, losing the meeting and wedging both buttons.
  if (recording || starting) return;
  starting = true;
  $('rec').disabled = true;

  teardownCapture();
  resetTracks();
  $('after').classList.add('hide');
  setStatus('Requesting microphone…');

  try {
    streams.mic = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
  } catch (e) { return fail('Microphone unavailable: ' + e.message); }

  setStatus('Requesting system audio…');
  // restrictOwnAudio keeps our own output out of the "them" track; an unknown
  // constraint is fatal, so fall back rather than fail the whole recording.
  for (const audio of [{ restrictOwnAudio: true }, true]) {
    try {
      streams.sys = await navigator.mediaDevices.getDisplayMedia({
        video: { width: 4, height: 4, frameRate: 1 }, audio,
      });
      break;
    } catch (e) { /* try the next shape */ }
  }
  if (!streams.sys) return fail('System audio was denied. Nothing recorded.');
  streams.sys.getVideoTracks().forEach((t) => t.stop());
  if (streams.sys.getAudioTracks().length === 0)
    return fail('No system-audio track — loopback unsupported here.');

  ctx = new AudioContext({ sampleRate: SAMPLE_RATE });
  const url = URL.createObjectURL(new Blob([WORKLET], { type: 'text/javascript' }));
  await ctx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);
  await attach('mic', streams.mic);
  await attach('sys', streams.sys);

  navigator.mediaDevices.addEventListener('devicechange', onDeviceChange);
  for (const s of [streams.mic, streams.sys]) {
    s.getAudioTracks().forEach((tr) =>
      tr.addEventListener('ended', () => {
        deviceEvents.push({ at: Date.now() - startedAt, event: 'track-ended', label: tr.label });
        setStatus(`⚠ "${tr.label || 'a device'}" stopped mid-recording — audio from here is lost.`, 'warn');
      }));
  }

  startedAt = Date.now();
  recording = true;
  starting = false;
  $('stopBtn').disabled = false;
  $('rec').classList.add('rec-on');
  $('clock').classList.add('live');
  setStatus('● Recording…');

  tick = setInterval(() => {
    const s = Math.floor((Date.now() - startedAt) / 1000);
    $('clock').textContent =
      `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    for (const k of ['mic', 'sys']) T[k].val.textContent = (T[k].frames / SAMPLE_RATE).toFixed(0) + 's';
    // A driver that fails in place fires no event and keeps feeding zeros, so the
    // latched peak still reads healthy. `muted` is what actually catches it.
    for (const st of Object.values(streams)) {
      for (const tr of st?.getAudioTracks() ?? []) {
        if (tr.muted || tr.readyState === 'ended') {
          deviceEvents.push({ at: Date.now() - startedAt, event: 'track-muted', label: tr.label });
          setStatus(`⚠ "${tr.label || 'a device'}" went silent mid-recording.`, 'warn');
        }
      }
    }
    if (s > MAX_MINUTES * 60) stopRec();
  }, 250);

  capTimer = setTimeout(checkSignal, 4000);
}

function fail(msg) {
  teardownCapture();
  starting = false;
  $('rec').disabled = false;
  $('rec').classList.remove('rec-on');
  setStatus(msg, 'warn');
}

// Derive the length from the data itself. Trusting a separately-maintained
// counter is what turns any counter drift into an out-of-bounds write.
const concat = (chunks) => {
  const total = chunks.reduce((n, c) => n + c.length, 0);
  const out = new Float32Array(total);
  let at = 0;
  for (const c of chunks) { out.set(c, at); at += c.length; }
  return out;
};

async function stopRec() {
  if (!recording) return;
  recording = false;
  clearInterval(tick); clearTimeout(capTimer);
  navigator.mediaDevices.removeEventListener('devicechange', onDeviceChange);
  $('stopBtn').disabled = true;
  $('clock').classList.remove('live');
  setStatus('Saving…');

  const endedAt = Date.now();
  const sr = ctx.sampleRate;
  teardownCapture();
  try { await ctx.close(); } catch {}

  try {
    const mic = concat(T.mic.chunks);
    const sys = concat(T.sys.chunks);
    T.mic.chunks = []; T.sys.chunks = [];
    const { dir, meta } = await window.api.saveMeeting({
      startedAt, endedAt,
      title: $('title').value.trim(),
      notes: $('notes').value,
      sampleRate: sr,
      mic: new Uint8Array(mic.buffer),
      system: new Uint8Array(sys.buffer),
      timeline: {
        deviceEvents,
        mic: { renderBlocks: T.mic.blocks, emptyBlocks: T.mic.empty },
        system: { renderBlocks: T.sys.blocks, emptyBlocks: T.sys.empty },
      },
    });
    lastDir = dir;
    $('after').classList.remove('hide');

    const bad = Object.entries(meta.tracks).filter(([, t]) => t.silent).map(([k]) => k);
    if (bad.length) setStatus(`⚠ Saved, but ${bad.join(' and ')} captured silence.`, 'warn');
    else if (deviceEvents.length) setStatus(
      `⚠ Saved ${meta.durationSeconds.toFixed(0)}s, but an audio device changed or ` +
      `stopped during the recording — check the transcript for gaps.`, 'warn');
    else setStatus(
      `✓ Saved ${meta.durationSeconds.toFixed(0)}s · you ${meta.tracks.mic.voicedSeconds}s ` +
      `· them ${meta.tracks.system.voicedSeconds}s`, 'good');
  } catch (e) {
    setStatus('Save failed: ' + e.message, 'warn');
  } finally {
    // Must run even when concat or saveMeeting throws, or Record stays dead.
    T.mic.chunks = []; T.sys.chunks = [];
    $('rec').disabled = false;
    $('rec').classList.remove('rec-on');
    $('clock').textContent = '00:00';
  }
}

/**
 * The assistants a user might already pay for.
 *
 * The app never sees a login. It puts the prompt on the clipboard and opens the
 * provider's site in the normal browser, where the user is already signed in.
 * That is the whole integration — no keys, no OAuth, nothing to revoke, and it
 * works identically for every provider.
 */
const PROVIDERS = [
  { id: 'claude',     name: 'Claude' },
  { id: 'chatgpt',    name: 'ChatGPT' },
  { id: 'gemini',     name: 'Gemini' },
  { id: 'copilot',    name: 'Copilot' },
  { id: 'perplexity', name: 'Perplexity' },
  { id: 'grok',       name: 'Grok' },
  { id: 'mistral',    name: 'Le Chat' },
  { id: 'deepseek',   name: 'DeepSeek' },
  { id: '',           name: 'Clipboard only' },
];

function initProviders() {
  const sel = $('provider');
  sel.innerHTML = PROVIDERS.map(
    (p) => `<option value="${p.id}">${p.name}</option>`
  ).join('');
  let saved = null;
  try { saved = localStorage.getItem('provider'); } catch {}
  sel.value = saved ?? 'claude';
  if (!PROVIDERS.some((p) => p.id === sel.value)) sel.value = 'claude';
  sel.addEventListener('change', () => {
    try { localStorage.setItem('provider', sel.value); } catch {}
  });
}
initProviders();

/** Transcribe then put the write-up prompt on the clipboard. */
async function writeUp(dir, btn) {
  btn.disabled = true;
  try {
    const meeting = await window.api.readMeeting(dir);
    if (!meeting?.transcribed) {
      // On a fresh install this call also downloads ~640 MB. Promising a
      // four-minute transcription while silently fetching that is a lie.
      const ready = await window.api.modelsReady();
      setStatus(
        ready
          ? 'Transcribing on this machine — roughly 4 min per hour of audio…'
          : 'First run: downloading the ~640 MB speech model. This happens once.'
      );
      const t = await window.api.transcribe(dir);
      const echo = t.echoes ? ` (${t.echoes} echo line${t.echoes > 1 ? 's' : ''} removed)` : '';
      setStatus(`Transcribed ${t.count} utterances${echo}. Copying…`);
    }
    const p = await window.api.copyPrompt(dir);
    const providerId = $('provider')?.value ?? '';
    const providerName = PROVIDERS.find((x) => x.id === providerId)?.name ?? '';

    if (providerId) {
      await window.api.openProvider(providerId);
      setStatus(
        `✓ ~${p.words.toLocaleString()} words copied · ${providerName} opening — press Ctrl+V, ` +
          `then paste the answer back under Write-up.`,
        'good'
      );
    } else {
      setStatus(`✓ Copied ~${p.words.toLocaleString()} words to the clipboard.`, 'good');
    }
    if (!$('viewLib').classList.contains('hide')) await openMeeting(dir);
  } catch (e) {
    setStatus('Failed: ' + e.message, 'warn');
  } finally { btn.disabled = false; }
}

$('rec').addEventListener('click', start);
$('stopBtn').addEventListener('click', stopRec);
$('openRec').addEventListener('click', () => window.api.openFolder(lastDir));
$('write').addEventListener('click', (e) => writeUp(lastDir, e.target));
$('ontop').addEventListener('change', (e) => window.api.setAlwaysOnTop(e.target.checked));
window.addEventListener('beforeunload', (e) => {
  if (recording) { e.preventDefault(); e.returnValue = ''; }
});

/* ═══════════════════════════════ meetings ════════════════════════════════ */

let meetings = [], current = null, dtab = 'notes';

const fmtDate = (iso) => {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' +
         d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
};
const fmtDur = (s) => (s >= 60 ? `${Math.round(s / 60)}m` : `${Math.round(s)}s`);

/**
 * One render path for the sidebar.
 *
 * Everything that changes the list — clicking a row, saving a write-up, deleting
 * — used to call drawList(meetings, null) directly, which threw away the active
 * search. The rendered set is instead re-derived from the query box every time,
 * so a search survives interaction with its own results.
 */
let lastQuery = '';
let lastHits = null;   // { order: Map<dir,int>, snippets: {dir: html} }

function renderList() {
  const q = $('q').value.trim();
  let rows = meetings;
  let snippets = null;

  if (q && lastHits && lastQuery === q) {
    snippets = lastHits.snippets;
    rows = meetings
      .filter((m) => lastHits.order.has(m.dir))
      .sort((a, b) => lastHits.order.get(a.dir) - lastHits.order.get(b.dir));
  }

  if (!rows.length) {
    $('list').innerHTML = `<div class="row"><span class="snip">${
      q ? 'No matches.' : 'No meetings yet. Record one.'}</span></div>`;
    return;
  }

  $('list').innerHTML = rows.map((m, i) => {
    const hit = snippets?.[m.dir];
    return `<div class="row ${current === m.dir ? 'on' : ''}" data-i="${i}">
      <span class="t">${esc(m.title)}</span>
      <span class="m">
        <span class="pip ${m.written ? 'p-wr' : m.transcribed ? 'p-tx' : 'p-no'}"></span>
        ${fmtDate(m.startedAt)} · ${fmtDur(m.durationSeconds)}
      </span>
      ${hit ? `<span class="snip">${hit}</span>` : ''}
    </div>`;
  }).join('');

  // Close over the row object rather than round-tripping the path through a DOM
  // attribute — esc() does not escape quotes, and a path never needs to be markup.
  for (const el of $('list').querySelectorAll('.row[data-i]')) {
    const m = rows[Number(el.dataset.i)];
    el.addEventListener('click', () => openMeeting(m.dir));
  }
}

function drawDetail(m) {
  if (!m) {
    $('detail').innerHTML = '<div class="dbody"><p class="empty">Select a meeting.</p></div>';
    return;
  }
  const body =
    dtab === 'notes'
      ? m.notes?.trim()
        ? `<div class="doc">${renderMarkdown(m.notes)}</div>`
        : '<p class="empty">You did not type anything during this meeting.</p>'
      : dtab === 'transcript'
        ? m.transcript
          ? `<div class="doc script">${renderTranscript(m.transcript)}</div>`
          : '<p class="empty">Not transcribed yet. Use <b>Transcribe &amp; copy prompt</b>.</p>'
        : m.note
          ? `<div class="doc">${renderMarkdown(m.note)}</div>`
          : `<p class="empty">No write-up saved yet.<br><br>
               Click <b>Transcribe &amp; copy prompt</b>, paste it into Claude or ChatGPT,
               then paste what comes back here and save.</p>
             <textarea id="pasteNote" placeholder="Paste the write-up here…"></textarea>
             <div class="dacts" style="padding:12px 0 0">
               <button id="saveNote" class="btn sm">Save write-up</button>
             </div>`;

  $('detail').innerHTML = `
    <div class="dhead">
      <h2>${esc(m.title)}</h2>
      <div class="sub">${fmtDate(m.startedAt)} · ${fmtDur(m.durationSeconds)} ·
        ${m.transcribed ? 'transcribed' : 'not transcribed'}${m.hasAudio ? ' · audio kept' : ''}</div>
    </div>
    <div class="dacts">
      <button id="dWrite" class="btn primary sm">${m.transcribed ? 'Write up with…' : 'Transcribe, then write up'}</button>
      <button id="dOpen" class="btn sm">Open folder</button>
      <button id="dDel" class="btn sm">Delete</button>
    </div>
    <div class="dtabs">
      <button data-t="notes" class="${dtab === 'notes' ? 'on' : ''}">My notes</button>
      <button data-t="transcript" class="${dtab === 'transcript' ? 'on' : ''}">Transcript</button>
      <button data-t="note" class="${dtab === 'note' ? 'on' : ''}">Write-up</button>
    </div>
    <div class="dbody">${body}</div>`;

  for (const b of $('detail').querySelectorAll('.dtabs button')) {
    b.addEventListener('click', () => { dtab = b.dataset.t; drawDetail(m); });
  }
  $('dWrite').addEventListener('click', (e) => writeUp(m.dir, e.target));
  $('dOpen').addEventListener('click', () => window.api.openFolder(m.dir));
  $('dDel').addEventListener('click', async () => {
    if (!confirm(`Move "${m.title}" to the recycle bin?`)) return;
    try {
      await window.api.deleteMeeting(m.dir);
      setStatus('Moved to the recycle bin.');
    } catch (e) {
      // Most often the folder is already gone, so refresh regardless or a
      // phantom row stays in the list.
      setStatus('Could not delete: ' + e.message, 'warn');
    }
    current = null;
    await refresh();
    drawDetail(null);
  });
  $('saveNote')?.addEventListener('click', async () => {
    const text = $('pasteNote').value;
    try {
      const r = await window.api.saveNote(m.dir, text);
      setStatus(`✓ Write-up saved (${r.chars.toLocaleString()} chars).`, 'good');
      await refresh();
      await openMeeting(m.dir);
    } catch (e) { setStatus(e.message, 'warn'); }
  });
}

async function openMeeting(dir) {
  current = dir;
  const m = await window.api.readMeeting(dir);
  renderList();
  drawDetail(m);
}

async function refresh() {
  meetings = await window.api.listMeetings();
  renderList();
}

let searchTimer = null;
$('q').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    const q = $('q').value.trim();
    if (!q) { lastHits = null; lastQuery = ''; return renderList(); }

    const hits = await window.api.search(q);
    // The box may have moved on while this was in flight; applying a stale
    // response would filter the list by a query the user has already cleared.
    if ($('q').value.trim() !== q) return;

    const snippets = {};
    for (const h of hits) {
      const best = [h.notesHit, h.noteHit, h.transcriptHit].find((x) => x && x.includes('\u0001'));
      if (best) {
        snippets[h.dir] = esc(best)
          .replaceAll('\u0001', '<b>')
          .replaceAll('\u0002', '</b>');
      }
    }
    lastQuery = q;
    lastHits = { order: new Map(hits.map((h, i) => [h.dir, i])), snippets };
    renderList();
    setStatus(`${hits.length} meeting(s) match "${q}".`);
  }, 200);
});
$('clearQ').addEventListener('click', () => {
  $('q').value = '';
  lastHits = null; lastQuery = '';
  renderList();
});

/* ═════════════════════════════════ tabs ══════════════════════════════════ */

function showView(which) {
  const rec = which === 'rec';
  $('viewRec').classList.toggle('hide', !rec);
  $('viewLib').classList.toggle('hide', rec);
  $('tabRec').classList.toggle('on', rec);
  $('tabLib').classList.toggle('on', !rec);
  if (!rec) refresh();
}
$('tabRec').addEventListener('click', () => showView('rec'));
$('tabLib').addEventListener('click', () => showView('lib'));

window.api.meetingsDir().then((d) => setStatus(`Ready. Saving to ${d}`));

</script>
</body>
</html>
